<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arrow Puzzle</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2306070b'/%3E%3Cpath d='M18 39L32 25L46 39' fill='none' stroke='%23ebe7f2' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="style.css" />
</head>

<body class="game-page">
    <div class="bg-lights" aria-hidden="true">
        <span class="light light-1"></span>
        <span class="light light-2"></span>
        <span class="light light-3"></span>
    </div>

    <main class="app-content">
        <section id="skeleton-container" class="skeleton-view active" aria-label="Loading puzzle">
            <div class="skeleton-side-panel">
                <header class="topbar skeleton-topbar">
                    <div class="skeleton skeleton-brand"></div>

                    <div class="skeleton-actions">
                        <span class="skeleton skeleton-icon"></span>
                        <span class="skeleton skeleton-icon"></span>
                    </div>
                </header>

                <section class="stats-card skeleton-card">
                    <div class="skeleton-meta-row">
                        <span class="skeleton skeleton-pill"></span>
                        <span class="skeleton skeleton-pill small"></span>
                    </div>

                    <div class="skeleton-time-row">
                        <span class="skeleton skeleton-line"></span>
                        <span class="skeleton skeleton-line"></span>
                    </div>

                    <div class="skeleton-action-row">
                        <span class="skeleton skeleton-pill full"></span>
                    </div>
                </section>
            </div>

            <section class="board-stage skeleton-stage">
                <div class="skeleton-board">
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                    <span class="skeleton skeleton-cell"></span>
                </div>
            </section>
        </section>

        <section id="game-view" class="game-view" aria-label="Arrow Puzzle game">
            <div class="side-panel">
                <header class="topbar">
                    <a class="brand" href="index.html" aria-label="Arrow Puzzle home">
                        Arrow Puzzle
                    </a>

                    <nav class="top-actions" aria-label="Game actions">
                        <a class="icon-button" href="help.html" aria-label="Open help">
                            <span aria-hidden="true">?</span>
                        </a>

                        <button id="settings-button" class="icon-button" type="button" aria-label="Open settings">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="3.1"></circle>
                                <path d="M19.43 12.98c.04-.32.07-.65.07-.98s-.02-.66-.07-.98l1.72-1.34a.56.56 0 0 0 .13-.71l-1.63-2.82a.57.57 0 0 0-.68-.25l-2.03.82a7.54 7.54 0 0 0-1.7-.98l-.31-2.17A.57.57 0 0 0 14.37 3h-4.74a.57.57 0 0 0-.56.48l-.31 2.17c-.61.24-1.18.57-1.7.98L5.03 5.8a.57.57 0 0 0-.68.25L2.72 8.87a.56.56 0 0 0 .13.71l1.72 1.34c-.04.32-.07.65-.07.98s.02.66.07.98l-1.72 1.34a.56.56 0 0 0-.13.71l1.63 2.82a.57.57 0 0 0 .68.25l2.03-.82c.52.41 1.09.74 1.7.98l.31 2.17a.57.57 0 0 0 .56.48h4.74a.57.57 0 0 0 .56-.48l.31-2.17c.61-.24 1.18-.57 1.7-.98l2.03.82a.57.57 0 0 0 .68-.25l1.63-2.82a.56.56 0 0 0-.13-.71l-1.72-1.34Z"></path>
                            </svg>
                        </button>
                    </nav>
                </header>

                <section class="stats-card">
                    <div class="meta-row">
                        <div id="difficulty-control" class="custom-select">
                            <button class="select-trigger" type="button" aria-expanded="false">
                                <span class="select-kicker">Difficulty</span>
                                <strong class="select-value">Easy</strong>
                                <svg class="select-chevron" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M7 10L12 15L17 10"></path>
                                </svg>
                            </button>

                            <div class="select-menu" role="listbox">
                                <button class="select-option active" type="button" data-value="easy" role="option">Easy</button>
                                <button class="select-option" type="button" data-value="normal" role="option">Normal</button>
                                <button class="select-option" type="button" data-value="hard" role="option">Hard</button>
                                <button class="select-option" type="button" data-value="expert" role="option">Expert</button>
                            </div>
                        </div>

                        <div class="mini-stat moves-box">
                            <span>Moves</span>
                            <strong id="moves-display">0</strong>
                        </div>
                    </div>

                    <div class="time-row">
                        <div class="time-box">
                            <span>Time</span>
                            <strong id="time-display">00:00.000</strong>
                        </div>

                        <div class="time-box">
                            <span>Best Time</span>
                            <strong id="best-display">--:--.---</strong>
                        </div>
                    </div>

                    <div class="action-row">
                        <button id="reset-button" class="reset-button" type="button">
                            Reset
                        </button>
                    </div>
                </section>
            </div>

            <section id="board-stage" class="board-stage" aria-label="Puzzle board">
                <div id="board" class="board" aria-live="polite"></div>
            </section>
        </section>
    </main>

    <div id="settings-overlay" class="overlay settings-overlay" aria-hidden="true">
        <section class="modal-panel settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <header class="modal-header">
                <div>
                    <span class="modal-kicker">Game</span>
                    <h2 id="settings-title">Settings</h2>
                </div>

                <button id="settings-close" class="modal-close" type="button" aria-label="Close settings">
                    ×
                </button>
            </header>

            <div class="settings-grid">
                <div id="display-control" class="custom-select modal-select">
                    <button class="select-trigger" type="button" aria-expanded="false">
                        <span class="select-kicker">Display</span>
                        <strong class="select-value">Arrows</strong>
                        <svg class="select-chevron" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 10L12 15L17 10"></path>
                        </svg>
                    </button>

                    <div class="select-menu" role="listbox">
                        <button class="select-option active" type="button" data-value="arrows" role="option">Arrows</button>
                        <button class="select-option" type="button" data-value="numbers" role="option">Numbers</button>
                    </div>
                </div>

                <div id="style-control" class="custom-select modal-select">
                    <button class="select-trigger" type="button" aria-expanded="false">
                        <span class="select-kicker">Style</span>
                        <strong class="select-value">Classic</strong>
                        <svg class="select-chevron" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 10L12 15L17 10"></path>
                        </svg>
                    </button>

                    <div class="select-menu" role="listbox">
                        <button class="select-option active" type="button" data-value="classic" role="option">Classic</button>
                        <button class="select-option" type="button" data-value="gradient" role="option">Gradient</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="solved-overlay" class="overlay solved-overlay" aria-hidden="true">
        <section class="modal-panel solved-panel" role="dialog" aria-modal="true" aria-labelledby="solved-title">
            <span class="solved-mark" aria-hidden="true">✓</span>

            <h2 id="solved-title">Puzzle solved</h2>

            <p class="solved-text">
                Finished in <strong id="solved-time">00:00.000</strong>
            </p>

            <p class="solved-best">
                Best Time: <strong id="solved-best">--:--.---</strong>
            </p>

            <button id="solved-reset-button" class="primary-button" type="button">
                Reset
            </button>
        </section>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
